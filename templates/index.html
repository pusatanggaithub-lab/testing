
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asisten AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── */
:root{
  --bg:        #F3F7F6;
  --bg-2:      #E8F1EF;
  --surface:   #FFFFFF;
  --panel:     #FBFDFC;
  --line:      #E2EAE8;
  --line-2:    #D2DEDB;

  --accent:    #0F8A78;
  --accent-2:  #14B39B;
  --accent-soft:#E3F5F1;

  --ink:       #10201E;
  --ink-2:     #3B514E;
  --soft:      #6B807D;
  --faint:     #9BABA8;

  --user-a:    #0F8A78;
  --user-b:    #12A88F;
  --red:       #C2483F;
  --red-soft:  #FCEFEE;

  --sans:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, monospace;

  --sh-sm: 0 1px 2px rgba(16,32,30,.05);
  --sh-md: 0 6px 20px -8px rgba(16,32,30,.18);
  --sh-lg: 0 40px 80px -32px rgba(16,32,30,.28), 0 2px 8px rgba(16,32,30,.05);
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(900px 520px at 12% -10%, rgba(20,179,155,.14) 0%, transparent 62%),
    radial-gradient(700px 500px at 100% 110%, rgba(15,138,120,.10) 0%, transparent 60%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
}

/* ── SHELL ── */
.chat-shell{
  position:relative;
  width:100%;max-width:520px;
  height:100dvh;
  display:flex;flex-direction:column;
  background:var(--surface);
  overflow:hidden;
}
@media (min-height:700px) and (min-width:560px){
  .chat-shell{
    height:720px;max-height:92vh;
    border-radius:24px;
    border:1px solid var(--line);
    box-shadow:var(--sh-lg);
  }
}

/* ── HEADER ── */
.chat-hdr{
  display:flex;align-items:center;gap:12px;
  padding:16px 18px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  flex-shrink:0;
}
.hdr-avatar{
  width:40px;height:40px;border-radius:13px;flex-shrink:0;
  background:linear-gradient(145deg,var(--accent-2),var(--accent));
  display:flex;align-items:center;justify-content:center;
  color:#fff;box-shadow:0 6px 16px -6px rgba(15,138,120,.65);
}
.hdr-avatar svg{width:20px;height:20px;}
.hdr-info{flex:1;min-width:0;}
.hdr-name{font-size:14.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink);}
.hdr-status{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:11.5px;color:var(--soft);font-weight:500;}
.status-dot{
  width:6px;height:6px;border-radius:50%;background:var(--accent-2);
  box-shadow:0 0 0 3px rgba(20,179,155,.18);
  animation:pulse 2.2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.hdr-actions{display:flex;gap:6px;}
.hdr-btn{
  width:34px;height:34px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  color:var(--soft);cursor:pointer;transition:.16s ease;
  border:1px solid transparent;
}
.hdr-btn:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--line);}
.hdr-btn svg{width:15px;height:15px;}

/* ── STATUS BAR ── */
.chat-status{
  padding:7px 20px;flex-shrink:0;
  background:var(--panel);
  border-bottom:1px solid var(--line);
}
.cs-text{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;
  color:var(--faint);display:inline-flex;align-items:center;gap:6px;
}
.cs-text::before{
  content:'';width:5px;height:5px;border-radius:50%;background:var(--line-2);
}
.cs-text.typing{color:var(--accent);}
.cs-text.typing::before{background:var(--accent-2);animation:pulse 1s infinite;}
.cs-text.error{color:var(--red);}
.cs-text.error::before{background:var(--red);}

/* ── LOG ── */
.chat-log{
  flex:1;overflow-y:auto;padding:20px 18px 8px;
  display:flex;flex-direction:column;
  scroll-behavior:smooth;
}
.chat-log::-webkit-scrollbar{width:6px;}
.chat-log::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px;}
.chat-log::-webkit-scrollbar-track{background:transparent;}

.date-divider{
  display:flex;align-items:center;gap:12px;
  margin:2px 0 18px;
}
.date-divider::before,.date-divider::after{
  content:'';flex:1;height:1px;background:var(--line);
}
.date-divider span{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  color:var(--faint);
}

/* ── MESSAGES ── */
.msg-row{
  display:flex;align-items:flex-end;gap:9px;
  margin-bottom:14px;
  animation:msg-in .32s cubic-bezier(.22,1,.36,1) forwards;
  opacity:0;
}
.msg-row.user{flex-direction:row;justify-content:flex-end;}
@keyframes msg-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.msg-av{
  width:28px;height:28px;border-radius:9px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;
}
.bot-av{background:var(--accent-soft);color:var(--accent);border:1px solid var(--line);}
.bot-av svg{width:14px;height:14px;}
.user-av{
  background:linear-gradient(145deg,var(--user-b),var(--user-a));
  color:#fff;box-shadow:0 4px 10px -4px rgba(15,138,120,.6);
}

.msg-bubble-wrap{max-width:78%;display:flex;flex-direction:column;}
.msg-row.user .msg-bubble-wrap{align-items:flex-end;}

.msg-bubble{
  padding:11px 14px;
  font-size:14px;line-height:1.6;
  border-radius:16px;
  white-space:pre-wrap;word-break:break-word;
  letter-spacing:-.005em;
}
.msg-row.bot .msg-bubble{
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--ink-2);
  border-bottom-left-radius:6px;
  box-shadow:var(--sh-sm);
}
.msg-row.user .msg-bubble{
  background:linear-gradient(145deg,var(--user-b),var(--user-a));
  color:#fff;
  border-bottom-right-radius:6px;
  box-shadow:var(--sh-md);
}
.msg-time{
  font-family:var(--mono);font-size:9.5px;color:var(--faint);
  margin:5px 4px 0;
}

/* ── TYPING ── */
.typing-row{
  display:flex;align-items:flex-end;gap:9px;margin-bottom:14px;
  animation:msg-in .25s ease forwards;opacity:0;
}
.typing-bubble{
  background:var(--panel);border:1px solid var(--line);
  border-radius:16px;border-bottom-left-radius:6px;
  padding:13px 15px;display:flex;gap:5px;align-items:center;
  box-shadow:var(--sh-sm);
}
.typing-dot{
  width:6px;height:6px;border-radius:50%;background:var(--accent);
  opacity:.35;animation:bounce 1.3s infinite;
}
.typing-dot:nth-child(2){animation-delay:.18s}
.typing-dot:nth-child(3){animation-delay:.36s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-4px);opacity:1}}

/* ── WELCOME ── */
.welcome-wrap{
  display:flex;align-items:flex-end;gap:9px;margin-bottom:14px;
  animation:msg-in .32s ease forwards;opacity:0;
}
.welcome-bubble{
  background:linear-gradient(180deg,#F4FBF9,var(--panel));
  border:1px solid var(--line);
  border-radius:16px;border-bottom-left-radius:6px;
  padding:11px 14px;font-size:14px;color:var(--ink-2);
  line-height:1.6;max-width:78%;box-shadow:var(--sh-sm);
}
.welcome-time{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin:5px 4px 0;}

/* ── ERROR ── */
.error-bubble{
  background:var(--red-soft);
  border:1px solid rgba(194,72,63,.18);
  border-radius:14px;border-bottom-left-radius:6px;
  padding:10px 13px;font-size:13px;color:var(--red);
  display:flex;align-items:center;gap:8px;font-weight:500;
}
.error-bubble svg{width:14px;height:14px;flex-shrink:0;}

/* ── SCROLL BTN ── */
.scroll-btn{
  position:absolute;bottom:118px;right:18px;
  width:34px;height:34px;border-radius:50%;
  background:var(--surface);border:1px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--soft);
  box-shadow:var(--sh-md);
  transition:.18s ease;opacity:0;pointer-events:none;
  transform:translateY(6px);z-index:10;
}
.scroll-btn.visible{opacity:1;pointer-events:auto;transform:none;}
.scroll-btn:hover{color:var(--accent);border-color:var(--accent-2);}
.scroll-btn svg{width:14px;height:14px;}

/* ── INPUT ── */
.chat-input-area{
  flex-shrink:0;padding:12px 16px 14px;
  background:var(--surface);
  border-top:1px solid var(--line);
}
.input-row{
  display:flex;align-items:flex-end;gap:9px;
  background:var(--panel);
  border:1px solid var(--line-2);
  border-radius:16px;
  padding:8px 8px 8px 14px;
  transition:border-color .18s, box-shadow .18s, background .18s;
}
.input-row:focus-within{
  background:var(--surface);
  border-color:var(--accent-2);
  box-shadow:0 0 0 4px rgba(20,179,155,.12);
}
.chat-inp{
  flex:1;background:transparent;border:none;outline:none;
  font-family:var(--sans);font-size:14px;color:var(--ink);
  line-height:1.55;resize:none;min-height:24px;max-height:120px;padding:4px 0;
}
.chat-inp::placeholder{color:var(--faint);}
.send-btn{
  width:38px;height:38px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(145deg,var(--user-b),var(--user-a));
  border:none;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:.18s ease;
  box-shadow:0 6px 16px -6px rgba(15,138,120,.7);
}
.send-btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px -8px rgba(15,138,120,.8);}
.send-btn:active{transform:scale(.95);}
.send-btn.disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none;}
.send-btn svg{width:16px;height:16px;color:#fff;}

.input-hint{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 4px 0;gap:8px;
}
.hint-text,.hint-keys{font-family:var(--mono);font-size:10px;color:var(--faint);}
.key-badge{
  display:inline-flex;align-items:center;
  background:var(--panel);border:1px solid var(--line-2);
  border-radius:5px;padding:2px 6px;font-size:9.5px;color:var(--soft);
}
@media (max-width:420px){.hint-text{display:none}}
</style>
</head>
<body>

<div class="chat-shell">

  <!-- HEADER -->
  <div class="chat-hdr">
    <div class="hdr-avatar">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="6" width="14" height="10" rx="3.5"/>
        <path d="M10 3v3M7 11h.01M13 11h.01M7.5 13.5h5"/>
      </svg>
    </div>
    <div class="hdr-info">
      <div class="hdr-name">Asisten AI</div>
      <div class="hdr-status">
        <div class="status-dot"></div>
        <span id="hdrStatusText">Online · Siap membantu</span>
      </div>
    </div>
    <div class="hdr-actions">
      <div class="hdr-btn" title="Hapus riwayat" onclick="clearChat()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3,5 3,14 13,14 13,5"/>
          <line x1="1" y1="5" x2="15" y2="5"/>
          <path d="M6 5V3h4v2"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- STATUS BAR -->
  <div class="chat-status">
    <span class="cs-text" id="chatStatus">Model aktif · gpt-4o</span>
  </div>

  <!-- CHAT LOG -->
  <div class="chat-log" id="chatLogs">
    <div class="date-divider"><span>HARI INI</span></div>
    <div class="welcome-wrap">
      <div class="msg-av bot-av">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="6" width="14" height="10" rx="3.5"/><path d="M10 3v3M7 11h.01M13 11h.01"/>
        </svg>
      </div>
      <div class="msg-bubble-wrap">
        <div class="welcome-bubble">Halo! Ada yang bisa saya bantu?</div>
        <div class="welcome-time" id="welcomeTime"></div>
      </div>
    </div>
  </div>

  <!-- SCROLL TO BOTTOM -->
  <div class="scroll-btn" id="scrollBtn" onclick="scrollToBottom(true)">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3,6 8,11 13,6"/>
    </svg>
  </div>

  <!-- INPUT AREA -->
  <div class="chat-input-area">
    <div class="input-row">
      <textarea
        class="chat-inp"
        id="userInput"
        placeholder="Ketik pesan..."
        rows="1"
        onkeydown="handleKeydown(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="kirimPesan()">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="2" x2="9" y2="11"/>
          <polygon points="18,2 11,20 9,11 2,9"/>
        </svg>
      </button>
    </div>
    <div class="input-hint">
      <span class="hint-text">Pesan akan diproses AI</span>
      <span class="hint-keys">
        <span class="key-badge">Enter</span> kirim &nbsp;
        <span class="key-badge">Shift+Enter</span> baris baru
      </span>
    </div>
  </div>

</div>

<script>
/* ══════════════════════════════════════════
   UTILITIES
══════════════════════════════════════════ */
var BOT_ICON='<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="10" rx="3.5"/><path d="M10 3v3M7 11h.01M13 11h.01"/></svg>';

function nowTime(){
  return new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
}

function setStatus(text, cls){
  var el=document.getElementById('chatStatus');
  el.textContent=text;
  el.className='cs-text'+(cls?' '+cls:'');
  var hdr=document.getElementById('hdrStatusText');
  if(cls==='typing') hdr.textContent='AI sedang mengetik…';
  else if(cls==='error') hdr.textContent='Koneksi bermasalah';
  else hdr.textContent='Online · Siap membantu';
}

function scrollToBottom(smooth){
  var logs=document.getElementById('chatLogs');
  logs.scrollTo({top:logs.scrollHeight,behavior:smooth?'smooth':'instant'});
}

function autoResize(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,120)+'px';
}

function setSendEnabled(enabled){
  var btn=document.getElementById('sendBtn');
  btn.classList.toggle('disabled',!enabled);
  btn.disabled=!enabled;
}

/* Set welcome time */
document.getElementById('welcomeTime').textContent=nowTime();

/* Scroll indicator */
var logs=document.getElementById('chatLogs');
logs.addEventListener('scroll',function(){
  var scrollBtn=document.getElementById('scrollBtn');
  var atBottom=logs.scrollHeight-logs.scrollTop-logs.clientHeight<60;
  scrollBtn.classList.toggle('visible',!atBottom);
},{passive:true});

/* ══════════════════════════════════════════
   APPEND MESSAGE
══════════════════════════════════════════ */
function appendMessage(role, text){
  var logs=document.getElementById('chatLogs');

  var row=document.createElement('div');
  row.className='msg-row '+role;

  var avEl=document.createElement('div');
  avEl.className='msg-av '+(role==='bot'?'bot-av':'user-av');

  if(role==='bot'){
    avEl.innerHTML=BOT_ICON;
  } else {
    avEl.textContent='K';
  }

  var wrap=document.createElement('div');
  wrap.className='msg-bubble-wrap';

  var bubble=document.createElement('div');
  bubble.className='msg-bubble';
  bubble.textContent=text;

  var timeEl=document.createElement('div');
  timeEl.className='msg-time';
  timeEl.textContent=nowTime();

  wrap.appendChild(bubble);
  wrap.appendChild(timeEl);

  if(role==='bot'){
    row.appendChild(avEl);
    row.appendChild(wrap);
  } else {
    row.appendChild(wrap);
    row.appendChild(avEl);
  }

  logs.appendChild(row);
  scrollToBottom(true);
}

/* ══════════════════════════════════════════
   ERROR MESSAGE
══════════════════════════════════════════ */
function appendError(text){
  var logs=document.getElementById('chatLogs');
  var row=document.createElement('div');
  row.className='msg-row bot';

  var avEl=document.createElement('div');
  avEl.className='msg-av bot-av';
  avEl.innerHTML=BOT_ICON;

  var wrap=document.createElement('div');
  wrap.className='msg-bubble-wrap';

  var errEl=document.createElement('div');
  errEl.className='error-bubble';
  errEl.innerHTML='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M8 5v3.5M8 11h.01"/></svg>';
  errEl.appendChild(document.createTextNode(text));

  var timeEl=document.createElement('div');
  timeEl.className='msg-time';
  timeEl.textContent=nowTime();

  wrap.appendChild(errEl);
  wrap.appendChild(timeEl);
  row.appendChild(avEl);
  row.appendChild(wrap);
  logs.appendChild(row);
  scrollToBottom(true);
}

/* ══════════════════════════════════════════
   TYPING INDICATOR
══════════════════════════════════════════ */
var typingEl=null;

function showTyping(){
  if(typingEl)return;
  var logs=document.getElementById('chatLogs');
  typingEl=document.createElement('div');
  typingEl.className='typing-row';

  var avEl=document.createElement('div');
  avEl.className='msg-av bot-av';
  avEl.innerHTML=BOT_ICON;

  var bubble=document.createElement('div');
  bubble.className='typing-bubble';
  bubble.innerHTML='<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

  typingEl.appendChild(avEl);
  typingEl.appendChild(bubble);
  logs.appendChild(typingEl);
  scrollToBottom(true);
}

function hideTyping(){
  if(typingEl){typingEl.remove();typingEl=null;}
}

/* ══════════════════════════════════════════
   CLEAR CHAT
══════════════════════════════════════════ */
function clearChat(){
  var logs=document.getElementById('chatLogs');
  logs.innerHTML='';

  var div=document.createElement('div');
  div.className='date-divider';
  div.innerHTML='<span>SESI BARU</span>';
  logs.appendChild(div);

  var wrap=document.createElement('div');
  wrap.className='welcome-wrap';

  var avEl=document.createElement('div');
  avEl.className='msg-av bot-av';
  avEl.innerHTML=BOT_ICON;

  var bWrap=document.createElement('div');
  bWrap.className='msg-bubble-wrap';

  var bBubble=document.createElement('div');
  bBubble.className='welcome-bubble';
  bBubble.textContent='Riwayat telah dihapus. Ada yang bisa saya bantu?';

  var tEl=document.createElement('div');
  tEl.className='welcome-time';
  tEl.textContent=nowTime();

  bWrap.appendChild(bBubble);
  bWrap.appendChild(tEl);
  wrap.appendChild(avEl);
  wrap.appendChild(bWrap);
  logs.appendChild(wrap);

  setStatus('Model aktif · gpt-4o');
}

/* ══════════════════════════════════════════
   KEYBOARD HANDLER
══════════════════════════════════════════ */
function handleKeydown(e){
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    kirimPesan();
  }
}

/* ══════════════════════════════════════════
   KIRIM PESAN  ← FUNGSI ASLI DIPERTAHANKAN
══════════════════════════════════════════ */
async function kirimPesan(){
  var input=document.getElementById('userInput');
  var message=input.value.trim();
  if(!message)return;

  // Tampilkan pesan pengguna
  appendMessage('user',message);
  input.value='';
  input.style.height='auto';

  // UI: loading state
  setSendEnabled(false);
  showTyping();
  setStatus('AI sedang memproses…','typing');

  try{
    // Kirim ke backend Python via API POST
    var response=await fetch('/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:message})
    });

    var data=await response.json();

    hideTyping();
    // Tampilkan balasan dari backend Python/AI
    appendMessage('bot',data.reply);
    setStatus('Model aktif · gpt-4o');

  }catch(error){
    hideTyping();
    appendError('Gagal terhubung ke server. Periksa koneksi dan coba lagi.');
    setStatus('Koneksi gagal','error');
  }

  setSendEnabled(true);
  document.getElementById('userInput').focus();
}

/* ══════════════════════════════════════════
